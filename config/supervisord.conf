; Non-root process supervisor (PID 1). All logs go to the container stdout.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:code-server]
command=/usr/bin/code-server --config %(ENV_HOME)s/.config/code-server/config.yaml --disable-telemetry --disable-update-check %(ENV_WORKSPACE)s
priority=10
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/bin/bash -c '[[ "${DEVBOX_REDIS:-true}" == "true" ]] || exit 0; mkdir -p "$HOME/.local/share/redis"; exec redis-server /etc/devbox/redis.conf --dir "$HOME/.local/share/redis"'
priority=20
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:restore-on-boot]
command=/usr/local/bin/devbox-restore --boot
priority=30
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:autobackup]
command=/usr/local/bin/devbox-autobackup
priority=40
autorestart=unexpected
exitcodes=0
startsecs=0
stopsignal=TERM
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tunnel]
command=/usr/local/bin/devbox-tunnel run
priority=50
autorestart=unexpected
exitcodes=0
startsecs=0
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
